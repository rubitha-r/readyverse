[build]
  command = "node scripts/build-deploy.js"
  publish = "deploy"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/coach-health"
  to = "/.netlify/functions/coach-health"
  status = 200

[[redirects]]
  from = "/api/coach"
  to = "/.netlify/functions/coach"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
